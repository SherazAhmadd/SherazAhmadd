name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # daily, 00:00 UTC (05:00 in Lahore)
  workflow_dispatch:       # run manually from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml", "scripts/**"]

permissions:
  contents: write          # lets the action commit the generated SVGs

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Repository totals and page views (right column); needs repo scope
      - name: Traffic
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/traffic.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: repositories
          plugin_traffic: yes
          extras_css: |
            h2 { color: #B8860B !important; }
            h2 svg { fill: #B8860B !important; }

      # Followers (left) and following (right), round avatars
      - name: Followers
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/followers.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_people: yes
          plugin_people_types: followers
          plugin_people_limit: 24
          plugin_people_size: 28
          extras_css: |
            h2 { color: #B8860B !important; }
            h2 svg { fill: #B8860B !important; }

      - name: Following
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/following.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_people: yes
          plugin_people_types: following
          plugin_people_limit: 24
          plugin_people_size: 28
          extras_css: |
            h2 { color: #B8860B !important; }
            h2 svg { fill: #B8860B !important; }

      # Recent activity and one clickable card per pinned repo (these read the
      # public API directly: the metrics activity plugin fails on GitHub's current
      # push-event format, and a single metrics image cannot link each repo)
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Activity, pinned cards and right column
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/activity.py
          python3 scripts/pinned.py
          python3 scripts/contributions.py
          python3 scripts/languages.py
          python3 scripts/right_column.py
      - name: Commit activity and pinned cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/activity.svg metrics/pinned-*.svg metrics/isocalendar.svg metrics/contribution-line.svg metrics/languages.svg metrics/right-column.svg README.md
          git diff --cached --quiet || { git commit -m "Update activity and pinned cards - [Skip GitHub Action]"; git push; }
